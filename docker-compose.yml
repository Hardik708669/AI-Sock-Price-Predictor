services:
  postgres:
    image: postgres:16-alpine
    container_name: stockvision-postgres
    environment:
      POSTGRES_DB: stockvision
      POSTGRES_USER: stockvision
      POSTGRES_PASSWORD: stockvision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockvision -d stockvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stockvision-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: stockvision-backend
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://stockvision:stockvision@postgres:5432/stockvision
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
